[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent2topic"
dynamic = ["version"]
description = "Agents work by time, reason by topic — Deterministic Markdown work-history compiler for AI agents and humans"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.scripts]
agent2topic = "agent_cli:main"
a2t = "agent_cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "scripts"}
packages = ["viewer_ui"]
py-modules = [
    "agent_cli",
    "atomic_io",
    "document_utils",
    "hierarchical_classifier",
    "process_lock",
    "review_content",
    "review_model",
    "review_ops",
    "review_renderer",
    "workspace_paths",
    "workspace_viewer",
]

[tool.setuptools.dynamic]
version = { attr = "agent_cli.PAGENT_VERSION" }

[tool.setuptools.package-data]
viewer_ui = ["*.html", "*.css", "*.js"]
