[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagent"
version = "0.2.0"
description = "Deterministic Markdown work-history and topic context compiler for AI agents and humans"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = []

[project.scripts]
pagent = "agent_cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = [
    "agent_cli",
    "atomic_io",
    "document_utils",
    "hierarchical_classifier",
    "process_lock",
    "review_content",
    "review_model",
    "review_ops",
    "review_renderer",
    "workspace_paths",
    "workspace_viewer",
]
