name: Release & PyPI Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -B -m unittest discover -s tests

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify viewer_ui static assets are bundled in wheel
        run: |
          python -c "
          import glob, zipfile
          wheels = glob.glob('dist/*.whl')
          assert wheels, 'No wheel built'
          with zipfile.ZipFile(wheels[0]) as zf:
              names = set(zf.namelist())
              for required in ('viewer_ui/index.html', 'viewer_ui/viewer.css', 'viewer_ui/viewer.js'):
                  assert required in names, f'Missing {required} in wheel'
          print('Wheel verification passed:', wheels[0])
          "

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI (when PYPI_ENABLED == 'true')
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Remove SHA256SUMS.txt before PyPI upload
        run: rm -f dist/SHA256SUMS.txt

      - name: Publish package distributions to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
